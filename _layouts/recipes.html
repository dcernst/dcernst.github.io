{% include header.html %}

<style>
.recipe-page .page-header { margin-top: 0; }
.recipe-page h1 { margin-top: 0; color: #1d2531; }
.recipe-intro { margin-bottom: 0; font-size: 16px; }
.recipe-search { margin-bottom: 24px; }
.recipe-search label { display: block; margin-bottom: 8px; }
.recipe-search-row { display: flex; gap: 8px; }
.recipe-search input { min-width: 0; flex: 1; padding: 12px; border: 1px solid #bfcbdb; border-radius: 6px; background: #fff; font: inherit; }
.recipe-search button { padding: 10px 16px; border: 1px solid #3f5fa8; border-radius: 6px; background: #3f5fa8; color: #fff; font: inherit; }
.recipe-search button:hover { background: #1d2531; }
.recipe-page :focus-visible { outline: 3px solid #3f5fa8; outline-offset: 3px; }
.recipe-search-help, .recipe-count { margin: 8px 0 0; color: #55606f; }
.recipe-page .recipe-item { margin-bottom: 12px; padding: 16px 20px; border: 1px solid #bfcbdb; border-left: 4px solid #3f5fa8; border-radius: 6px; background: #fff; }
.recipe-page .recipe-item summary { color: #1d2531; }
.recipe-page .recipe-item summary h2 { max-width: calc(100% - 28px); font-size: 21px; line-height: 1.4; }
.recipe-page .recipe-item summary:hover { color: #3f5fa8; }
.recipe-page .recipe-item[open] { border-left-color: #3f5fa8; }
.recipe-page .recipe-item[open] summary { margin-bottom: 18px; }
.recipe-page .recipe-item h3 { color: #3f5fa8; font-size: 18px; }
.recipe-page .recipe-item li { margin-bottom: 5px; }
.recipe-page a { color: #3f5fa8; text-decoration: underline; }
.recipe-page .recipe-list > hr { display: none; }
.recipe-page [hidden] { display: none !important; }
.recipe-empty { padding: 24px; border-radius: 6px; background: #f4f7fb; }
@media (max-width: 480px) {
.recipe-page .page-header { padding: 20px; }
.recipe-page .recipe-item { padding: 14px; }
.recipe-page .recipe-item summary h2 { font-size: 19px; }
}
</style>

<!-- Begin page content -->
<main class="container site-main recipe-page">
{% include research-banner.html %}
<hr class="site-divider">

<div class="page-header">
<h1>{{ page.title }}</h1>
<p class="recipe-intro">A collection of favorites for the table. Pick a recipe and get cooking.</p>
</div>

<div class="recipe-search" role="search" aria-label="Recipe filter" hidden>
<label for="recipe-search">Find a recipe</label>
<div class="recipe-search-row">
<input id="recipe-search" type="search" placeholder="Try pizza, chicken, or basil" aria-describedby="recipe-search-help" aria-controls="recipe-results" autocomplete="off">
<button id="recipe-clear" type="button">Clear</button>
</div>
<p id="recipe-search-help" class="recipe-search-help">Search recipe names and ingredients.</p>
<p id="recipe-count" class="recipe-count" role="status" aria-live="polite" aria-atomic="true"></p>
</div>

<div class="row">
<div class="col-xs-12" id="recipe-results">
{{ content }}
<p id="recipe-empty" class="recipe-empty" hidden>No recipes match. Try another ingredient or clear your search.</p>
</div>
</div>
</main>

<script src="{{ site.baseurl }}/js/recipe-search.js" defer></script>

{% include footer.html %}
