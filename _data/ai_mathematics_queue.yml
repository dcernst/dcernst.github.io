  draft_summary: The essay explores the difference between obtaining mathematical results and the human experience of discovering and understanding them. Through accounts of colleagues and students at Cornell, it contrasts enthusiasm for AI-assisted research with concern about lost training opportunities, recognition, and the joy of discovery. It argues that mathematics also has value as a creative and communal activity, while leaving unresolved how that value can coexist with increasingly capable machines. This is a personal reflection on mathematical culture and student formation, not a study of AI's effects on learning or research careers.
